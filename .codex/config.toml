# Project-scoped Codex defaults. These settings load only when the repository is trusted.
# Explicit user choices and organization-managed policy can override them.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
model_verbosity = "low"
personality = "pragmatic"

# Safe local-development defaults. External, destructive, and production actions
# still require the authority defined in AGENTS.md and SECURITY.md.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

# Keep room for the root instructions plus future nested project guidance.
project_doc_max_bytes = 65536

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
interrupt_message = true

