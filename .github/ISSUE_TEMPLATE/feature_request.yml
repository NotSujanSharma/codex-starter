name: Feature request
description: Propose a reusable improvement to the public template
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Which project kickoff or agentic-programming problem is not handled well today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe the observable result rather than only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example requests
      description: Include requests that should trigger this behavior and, when relevant, requests that should not.
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs
      description: Note cost, latency, complexity, compatibility, or safety implications.
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This proposal is stack-agnostic or explains why it belongs in the shared template.
          required: true

